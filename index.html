<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fischerprüfung NRW</title>
<meta name="theme-color" content="#1f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fischerprüfung">

<style>
:root{
  --bg:#f4f6f3; --card:#ffffff; --ink:#17231d; --muted:#5d6b63; --line:#dde3dd;
  --brand:#1f6b4f; --brand-2:#2f8a66; --brand-ink:#ffffff; --soft:#e5f0ea;
  --ok:#1d7a46; --ok-bg:#e2f4e8; --bad:#b3261e; --bad-bg:#fbe5e3; --warn:#8a5a00; --warn-bg:#fff2d6;
  --sel:#dbe9f7; --sel-line:#2d6fb3; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --A:#2f7fb8; --B:#2f8a66; --C:#0f8b8d; --D:#7a9a2a; --E:#b06a1f; --F:#7b5aa6;
}
:root[data-theme="dark"]{
  --bg:#0f1512; --card:#18211c; --ink:#e7eee9; --muted:#9db0a5; --line:#2a3630;
  --brand:#3fa77c; --brand-2:#57be92; --brand-ink:#08130d; --soft:#1f2e26;
  --ok:#5fd393; --ok-bg:#163424; --bad:#ff8a80; --bad-bg:#3a1a18; --warn:#f2c46b; --warn-bg:#3a2c10;
  --sel:#1d3550; --sel-line:#6aa8e8; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:12px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
header.top h1{font-size:18px;margin:0;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:0;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;cursor:pointer;color:inherit}
.iconbtn:active{background:rgba(255,255,255,.18)}
.iconbtn svg{width:24px;height:24px}
.timer{font-variant-numeric:tabular-nums;font-weight:650;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;font-size:15px}
.timer.low{background:#ffdad6;color:#7a0d07}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 4px 8px;font-weight:650}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:16px}
.hero{margin-top:16px;padding:18px;display:flex;gap:16px;align-items:center}
.ring{width:84px;height:84px;flex:none}
.hero .t1{font-size:20px;font-weight:700;margin:0}
.hero .t2{color:var(--muted);margin:2px 0 0;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:650;cursor:pointer;background:var(--brand);color:var(--brand-ink);font-size:16px}
.btn:active{filter:brightness(.92)}
.btn.sec{background:var(--soft);color:var(--brand)}
:root[data-theme="dark"] .btn.sec{color:var(--brand-2)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px;flex:none}
.row{display:flex;gap:10px}
.row>*{flex:1}
.mt{margin-top:12px}.mt2{margin-top:20px}
.tile{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.tile+.tile{border-top:1px solid var(--line)}
.tile:active{background:var(--soft)}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:750;color:#fff;flex:none}
.tile .tt{flex:1;min-width:0}
.tile .tt b{display:block;font-weight:620}
.tile .tt small{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--brand-2);border-radius:3px}
.chev{color:var(--muted);flex:none}
.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin:16px 2px 8px;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--soft);color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:4px}
.qtext{font-size:19px;font-weight:620;line-height:1.35;margin:0}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;width:100%;font-size:16px;line-height:1.4}
.opt .k{flex:none;width:28px;height:28px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--soft)}
.opt.sel{border-color:var(--sel-line);background:var(--sel)}
.opt.sel .k{background:var(--sel-line);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.note{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:620}
.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.bad{background:var(--bad-bg);color:var(--bad)}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bottombar .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.cell{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:650;font-size:14px;cursor:pointer;position:relative}
.cell.ans{background:var(--sel);border-color:var(--sel-line)}
.cell.cur{outline:2.5px solid var(--brand);outline-offset:1px}
.cell.flag::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:4px;background:#e2a400}
.cell.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.secgrid h3{font-size:14px;margin:14px 0 8px;color:var(--muted);font-weight:650}
.result{text-align:center;padding:24px 16px}
.result .big{font-size:44px;font-weight:800;margin:6px 0 0;font-variant-numeric:tabular-nums}
.result .verdict{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:999px;font-weight:700}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}.verdict.bad{background:var(--bad-bg);color:var(--bad)}
table.sec{width:100%;border-collapse:collapse;font-size:15px}
table.sec td{padding:10px 4px;border-top:1px solid var(--line)}
table.sec td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.okc{color:var(--ok)}.badc{color:var(--bad)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.fbtn.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.qitem{padding:14px 16px}
.qitem+.qitem{border-top:1px solid var(--line)}
.qitem .q{font-weight:600}
.qitem ol{margin:8px 0 0;padding-left:0;list-style:none;font-size:15px}
.qitem li{padding:3px 0;color:var(--muted)}
.qitem li.c{color:var(--ok);font-weight:650}
.qitem li.w{color:var(--bad);text-decoration:line-through}
.qitem .id{font-size:12px;color:var(--muted);font-weight:650;letter-spacing:.03em}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:12px}
.setrow+.setrow{border-top:1px solid var(--line)}
.setrow small{display:block;color:var(--muted)}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:15px;transition:.2s}
.switch span::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:12px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--brand-2)}
.switch input:checked+span::before{transform:translateX(20px)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:14px}
.prose p{margin:0 0 10px}.prose ul{margin:0 0 10px;padding-left:20px}
.hist{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.hist+.hist{border-top:1px solid var(--line)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--card);border-radius:18px;max-width:420px;width:100%;padding:20px}
.modal h3{margin:0 0 8px;font-size:18px}
.modal p{margin:0 0 16px;color:var(--muted)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.progtop{height:4px;background:rgba(255,255,255,.25)}
.progtop>i{display:block;height:100%;background:#fff}
.plate{background:#eef2ee;border-radius:12px;padding:6px;display:flex;align-items:center;justify-content:center}
:root[data-theme="dark"] .plate{background:#dfe6e0}
.plate svg{width:100%;height:auto;display:block;max-height:120px}
.plate.sm{width:66px;height:54px;flex:none;padding:4px}.plate.sm svg{max-height:46px}
.plate.lg svg{max-height:190px}.plate.wide svg{max-height:none}
.plate.scroll{overflow-x:auto;display:block}.plate.scroll svg{min-width:640px}
.ptiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
@media(min-width:560px){.ptiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ptiles.one{grid-template-columns:1fr}
.ptile{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:8px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.ptile .plate svg{max-height:92px}
.ptile.sel{border:2.5px solid var(--sel-line);background:var(--sel);padding:7px}
.ptile.okt{border:2.5px solid var(--ok);background:var(--ok-bg);padding:7px}.ptile.badt{border:2.5px solid var(--bad);background:var(--bad-bg);padding:7px}
.ptile[disabled]{cursor:default}
.pn{font-weight:650;font-size:14px;line-height:1.3}.pc{font-size:12px;color:var(--muted);line-height:1.3}
.ordn{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:750;display:grid;place-items:center;z-index:1}
.pchips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}.pchips::-webkit-scrollbar{display:none}
.pchip{flex:none;border:0;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:650;background:var(--soft);color:var(--muted);cursor:pointer}
.pchip.done{background:var(--ok-bg);color:var(--ok)}.pchip.cur{background:var(--brand);color:var(--brand-ink)}
.ph{margin:2px 4px 0;font-size:20px;font-weight:700}
.lbl{font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.srow{display:flex;gap:12px;align-items:center;padding:10px 14px}.srow+.srow{border-top:1px solid var(--line)}
.srow .tt{flex:1;min-width:0}.srow b{font-weight:600;font-size:15px;line-height:1.35}
.pts{font-size:12px;font-weight:700;color:var(--muted);flex:none}
.num{width:26px;height:26px;border-radius:13px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.tipbox{padding:12px 14px;border-radius:12px;background:var(--soft);font-size:14px}.tipbox ul{margin:6px 0 0;padding-left:18px}.tipbox li{margin:3px 0}
.pill{font-size:12px;font-weight:650;padding:4px 8px;border-radius:8px;background:var(--soft);color:var(--muted);flex:none}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.chip.on{background:var(--brand);color:var(--brand-ink)}
.brow{display:flex;gap:10px;align-items:baseline;padding:10px 14px}.brow+.brow{border-top:1px solid var(--line)}.brow .tt{flex:1;min-width:0;font-size:14px}.brow.sum{background:var(--soft)}
.bn{width:22px;flex:none;font-size:12px;color:var(--muted);font-weight:650}
.fix{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.warnc{color:var(--warn)}
.ksteps{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:560px){.ksteps{grid-template-columns:1fr 1fr}}
.kcap{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:6px}
.cap3,.cap4{display:grid;text-align:center;font-size:13px;font-weight:600;margin-top:6px}.cap3{grid-template-columns:repeat(3,1fr)}.cap4{grid-template-columns:repeat(4,1fr)}
.btn.okb{background:var(--ok-bg);color:var(--ok)}.btn.badb{background:var(--bad-bg);color:var(--bad)}
.btn.selb{border:2px solid var(--sel-line);background:var(--sel)}
.verdict{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:700}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mini{padding:14px}.mini .v{font-size:22px;font-weight:750;margin-top:2px}
header.top{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pchips{-webkit-overflow-scrolling:touch}
</style>
</head>

<div id="app"></div>
<script>

n mindestens durchführen können?","a":["Gesamt-Phosphor-Gehalt, Eisengehalt","pH-Wert, Sauerstoffgehalt, Temperatur","Stickstoff-, Chrom- und Ammoniakgehalt"],"c":1},{"id":"C47","s":"C","n":47,"q":"Hat die Kleintierlebewelt im Gewässer einen Nutzen, gegebenenfalls welchen?","a":["Nein","Ja, sie ist die Ernährungsgrundlage u. a. für Fische","Ja, sie versorgt das Wasser mit Sauerstoff"],"c":1},{"id":"C48","s":"C","n":48,"q":"In welcher Fischregion der Fließgewässer sind regelmäßig die meisten Fischarten vorhanden?","a":["Äschenregion","Brassenregion","Barbenregion"],"c":1},{"id":"C49","s":"C","n":49,"q":"Was ist ein Altwasser?","a":["Ein früherer (alter), als solcher erkennbarer Abschnitt eines Fließgewässers, der wassergefüllt ist","Ein Gewässer, dessen Wasser gealtert ist","Ein Gewässer mit überaltertem Fischbestand"],"c":0},{"id":"C50","s":"C","n":50,"q":"Können Fische aus einem durch Abwasser verursachten Fischsterben oder solche, die einen fremdartigen Geruch ausströmen, Pilzbefall oder Hautrötungen zeigen, gegessen oder verfüttert werden?","a":["Gegen den Genuss bestehen für Mensch und Tier keine Bedenken","Der Genuss ist nur für den Menschen schädlich","Die Fische sind ungenießbar für Mensch und Tier"],"c":2},{"id":"C51","s":"C","n":51,"q":"Welche Angaben sind für die Fangstatistik wichtig?","a":["Fangdatum, Art, Länge und Gewicht des Fisches","Witterung, Wassertemperatur und Köder","Form und Färbung des Fisches sowie Dauer des Drills"],"c":0},{"id":"C52","s":"C","n":52,"q":"Wozu dient die Fangstatistik?","a":["Um Fänge besonders großer Fische nachzuweisen","Als Unterlage für die fischereiliche Bewirtschaftung und für Schadenersatzforderung","Sie dient keinem Zweck"],"c":1},{"id":"C53","s":"C","n":53,"q":"Was ist beim Aussetzen von Fischen besonders zu beachten?","a":["Man muss geeignete Stellen auswählen; vor dem Aussetzen müssen die Fische temperiert werden","Man muss die Einwilligung der Ober- und Unterlieger einholen","Man muss Schaulustige fernhalten"],"c":0},{"id":"C54","s":"C","n":54,"q":"Was ist beim Kauf der Satzfische vor allem zu beachten?","a":["Die Fische müssen frei von Parasiten und erkennbaren Krankheitserscheinungen sein","Die Fische sollen gleiche Größe und gleiches Gewicht haben","Die Fische müssen preiswert sein"],"c":0},{"id":"C55","s":"C","n":55,"q":"Was verbirgt sich hinter dem Wort Wasserpest?","a":["Eine Wasservergiftung","Eine Fischkrankheit","Eine Wasserpflanzenart"],"c":2},{"id":"C56","s":"C","n":56,"q":"Wodurch kann das biologische Gleichgewicht in Gewässern u. a. gestört werden?","a":["Durch das Vorkommen von Raubfischen","Durch einseitigen Fischbesatz","Durch Verbot des Angelns mit Köderfischen"],"c":1},{"id":"C57","s":"C","n":57,"q":"Können frisch ausgekieste Baggerseen schon fischereilich genutzt werden?","a":["Ja, ohne Einschränkung","Nein, erst nach Entwicklung des tierischen und pflanzlichen Lebens","Ja, sofort nach Durchführung eines starken Fischbesatzes"],"c":1},{"id":"C58","s":"C","n":58,"q":"Welches Merkmal kennzeichnet ein fruchtbares, stehendes Gewässer?","a":["Klares Wasser (große Sichttiefe)","Starker Überwasserpflanzenwuchs","Durch Plankton getrübtes Wasser (geringe Sichttiefe)"],"c":2},{"id":"C59","s":"C","n":59,"q":"Sind Altarme eines Gewässers ökologisch besonders wertvoll?","a":["Nein, weil sie zur Verlandung neigen und nur noch wenigen Tieren und Pflanzen geeigneten Lebensraum bieten","Ja, weil sie für Fische, Amphibien und Vögel geeignete Lebensbedingungen bieten","Ja, weil ihr Wasser leicht zur Versauerung neigt"],"c":1},{"id":"C60","s":"C","n":60,"q":"Haben flache Ufer in einem Gewässer eine besondere fischereiliche Bedeutung?","a":["Nein, weil die Fische dort besonders gut von fischfressenden Vögeln erbeutet werden können","Ja, weil sich die Fische hier gerne aufhalten, um zu überwintern","Ja, weil sie eine sehr starke Fischnährtierproduktion aufweisen und für viele Fische und andere Tierarten ideale Fortpflanzungs- und Aufwuchszonen bilden"],"c":2},{"id":"C61","s":"C","n":61,"q":"Welche fischereiliche Bedeutung haben Kolke und Gumpen in fließenden Gewässern?","a":["Sie können sich nachteilig auswirken, weil in ihnen das Wasser sauerstoffarm wird","Sie werden von Fischen gemieden","Sie sind bevorzugte Standplätze der Fische"],"c":2},{"id":"C62","s":"C","n":62,"q":"Warum ist in einigen Fällen bei nachhaltiger Nutzung des Fischbestands künstlicher Fischbesatz erforderlich?","a":["Weil zu viele Jungfische durch Raubfische gefressen werden","Weil durch die von Menschenhand vorgenommenen Veränderungen an und in den Gewässern viele natürliche Laich- und Aufwuchsplätze zerstört worden sind","Weil die Mehrzahl der Laichfische gefangen wird und somit keine ausreichende Vermehrung mehr möglich ist"],"c":1},{"id":"C63","s":"C","n":63,"q":"Welche Hegemaßnahme ist zu treffen, wenn in einem Gewässer der Bestand an Weißfischen und Flussbarschen überhandnimmt?","a":["Verstärkter Besatz mit den gleichen Arten","Intensives Befischen und Besatz mit geeigneten Raubfischen","Nichts, denn der Bestand geht ohnehin wegen \"Degeneration\" zugrunde"],"c":1},{"id":"C64","s":"C","n":64,"q":"Wie soll sich der Fischer verhalten, wenn er einen krankheitsverdächtigen Fisch fängt?","a":["Er soll den Fisch nach Möglichkeit dem zuständigen Gewässerwart oder Fischereiaufseher zwecks weiterer Veranlassung übergeben","Er soll den Fisch töten und vergraben","Er soll den Fisch möglichst schnell wieder in das Gewässer zurücksetzen, damit dieser keinen weiteren Schaden erleidet"],"c":0},{"id":"C65","s":"C","n":65,"q":"Was ist typisch für das stehende Zandergewässer?","a":["Es ist tief, klar und nahrungsarm","Es ist flach, hartgründig und sommertrüb","Es ist klein, stark verkrautet und recht warm"],"c":1},{"id":"C66","s":"C","n":66,"q":"Ist es sinnvoll, in einem Gewässer große Hechte zu schonen?","a":["Ja, denn große Fische ergeben größere Erträge pro ha Gewässerfläche","Die Größe der Fische spielt keine Rolle","Nein, denn größere Fische sind schlechte Futterverwerter"],"c":2},{"id":"C67","s":"C","n":67,"q":"Ist das Einbringen großer Mengen Anfuttermittel schädlich?","a":["Nein, die Fische wachsen dadurch besser ab","Nein, es wird ohne Folgen für das Gewässer zersetzt","Ja, es fördert die Eutrophierung des Gewässers"],"c":2},{"id":"C68","s":"C","n":68,"q":"Können eingebrachte Laichhilfen als sinnvoll angesehen werden?","a":["Nein, sie werden von den Fischen grundsätzlich nicht angenommen","Ja, wenn aufgrund der Strukturarmut des Gewässers ein Mangel an natürlichen Laichplätzen besteht","Nein, sie verrotten und belasten das Gewässer mit fäulnisfähigen Stoffen"],"c":1},{"id":"C69","s":"C","n":69,"q":"Wozu dient der Hegeplan?","a":["Zur Festlegung fischereilicher Maßnahmen an einem Gewässer unter ökologischen Gesichtspunkten","Zur finanziellen Gleichbehandlung der Genossenschaftsmitglieder","Zur Erhöhung der Fangausbeute"],"c":0},{"id":"C70","s":"C","n":70,"q":"Welche fischereilichen Maßnahmen sollten an Wasserkraftanlagen getroffen werden?","a":["Keine, weil Wasserkraft eine umweltfreundliche Technologie ist","Der Betreiber der Anlage sollte ausreichend Fischbesatz tätigen","Für Fischwanderwege, ausreichende Restwassermengen sowie eine Schutzvorrichtung vor den Turbinen sollte gesorgt sein"],"c":2},{"id":"C71","s":"C","n":71,"q":"Können Steinschüttungen zur Uferbefestigung ein Problem für Fische sein?","a":["Ja, denn sie verhindern die natürliche seitliche Verlagerung und Gestaltung des Gewässers","Nein, denn sie schaffen Unterstände für gefährdete Arten und verhindern, dass unterspülte Bäume ins Wasser fallen","Ja, denn sie werden von den Jugendstadien zahlreicher Fischparasiten bewohnt"],"c":0},{"id":"C72","s":"C","n":72,"q":"Können Querbauwerke wie Wehre und Sohlabstürze in Fließgewässern Fischbestände beeinträchtigen?","a":["Ja, denn an diesen Stellen wird Sauerstoff ins Wasser eingebracht","Ja, denn sie behindern den Fischwechsel","Nein, Querbauwerke sind sogar von Vorteil, denn sie verhindern, dass Besatzfische den Gewässerabschnitt verlassen"],"c":1},{"id":"C73","s":"C","n":73,"q":"Woran erkennt man ein Fischsterben, das durch eine Krankheit hervorgerufen wird?","a":["Das Fischsterben vernichtet meist alle im Gewässer vorkommenden Fische innerhalb kurzer Zeit","Das Fischsterben ist in der Regel schleichend und erfasst nur eine oder miteinander verwandte Fischarten","Das Fischsterben erstreckt sich nur auf die am Boden des Gewässers lebenden Fische"],"c":1},{"id":"C74","s":"C","n":74,"q":"Woran erkennt man ein Fischsterben, das durch Abwässer hervorgerufen wird?","a":["Das Fischsterben vernichtet meist alle im Gewässer vorkommenden Fische innerhalb kurzer Zeit","Das Fischsterben ist meistens schleichend und erfasst in der Regel nur bestimmte Fischarten","Das Fischsterben erstreckt sich nur auf die am Boden des Gewässers lebenden Fische"],"c":0},{"id":"C75","s":"C","n":75,"q":"Wozu dient ein Umgehungsgerinne?","a":["Sauerstoff in das Gewässer einzutragen","Kanusportler um ein Laichschongebiet herumzuführen","Ein Querbauwerk für wandernde Fische durchgängig zu machen"],"c":2},{"id":"C76","s":"C","n":76,"q":"Wie soll mit gefangenen Fischen verfahren werden, die eine Farbmarkierung aufweisen oder mit einem Sender versehen sind?","a":["Der Fisch soll schonend zurückgesetzt werden. Angaben zu Fischart, Länge und Fangort sollen wenn möglich mit Foto den Fischereibehörden oder -verbänden gemeldet werden","Der Fisch soll als Kuriosum sofort der örtlichen Tageszeitung gemeldet werden","Der Fisch soll unbedingt entnommen und tiefgekühlt dem Fischgesundheitsdienst übergeben werden"],"c":0},{"id":"C77","s":"C","n":77,"q":"Was soll für Fischwanderhilfen gelten?","a":["Die Sohle muss möglichst glatt sein, damit die Fische keine Flossenverletzungen erleiden","Die Wasserführung muss ausreichend sein, damit sich eine starke Leitströmung ergibt","Die Wanderhilfe darf auf keinen Fall länger als 20 m sein"],"c":1},{"id":"D1","s":"D","n":1,"q":"Was ist unter Fluchtdistanz zu verstehen?","a":["Die Entfernung, ab welcher ein Tier vor einem wirklichen oder vermeintlichen Feind flüchtet","Die von einem gehakten Fisch während der Drillphase zurückgelegte Distanz","Die im Castingsport beim Werfen erzielte Weite"],"c":0},{"id":"D2","s":"D","n":2,"q":"Welche Maßnahmen sind u. a. für den Schutz des Eisvogels erforderlich?","a":["Besatz aller Gewässer mit kleinen Goldorfen","Einbringen von Pfählen ins Wasser, damit der Vogel dort auf Beute lauern kann","Schaffung von Steilufern und Schutz geeigneter Nistbereiche"],"c":2},{"id":"D3","s":"D","n":3,"q":"Welche Wasserinsektenart ist gesetzlich geschützt?","a":["Die Rote Zuckmückenlarve","Der Kolbenwasserkäfer","Keine"],"c":1},{"id":"D4","s":"D","n":4,"q":"Was hat nach dem Landen eines maßigen und verwertbaren Fisches sofort zu geschehen?","a":["Wiegen und Längenmessung","Entfernen des Angelhakens","Betäuben und Töten"],"c":2},{"id":"D5","s":"D","n":5,"q":"Wie wird der Fisch waidgerecht getötet?","a":["Der Fisch bleibt auf dem Land, bis er erstickt ist","Durch Einschnitt an der Schwanzwurzel","Durch einen Schlag auf den Gehirnschädel und durch Herzstich"],"c":2},{"id":"D6","s":"D","n":6,"q":"Welches Instrument wird zur Tötung des Fisches benutzt?","a":["Jeder beliebige Gegenstand","Ein Stein","Schlagholz und Messer"],"c":2},{"id":"D7","s":"D","n":7,"q":"Gefährden Molchlarven und Kaulquappen Fischbrut?","a":["Ja, sie leben ausschließlich von Fischbrut","Ja, sie übertragen gefährliche Außenparasiten","Nein"],"c":2},{"id":"D8","s":"D","n":8,"q":"Was tut man, wenn der Fisch den Angelhaken zu tief geschluckt hat?","a":["Der Haken wird unter Kraftaufwendung aus dem Fisch entfernt","Der Fisch wird sofort waidgerecht getötet","Der Haken wird im Fischkörper belassen, bis der Fisch erstickt ist"],"c":1},{"id":"D9","s":"D","n":9,"q":"Was macht man, wenn man einen untermaßigen Fisch gefangen hat?","a":["Man schneidet die Schnur durch und lässt den Fisch frei","Man löst den Fisch vorsichtig mit nassen Händen vom Haken und setzt ihn ins Wasser zurüc const Q = DATA.questions, T = DATA.titles, S = ['A','B','C','D','E','F'];
const COL = {A:'var(--A)',B:'var(--B)',C:'var(--C)',D:'var(--D)',E:'var(--E)',F:'var(--F)'};
const byId = Object.fromEntries(Q.map(q=>[q.id,q]));
const KEY = 'fp_nrw_v1';
const EXAM_MIN = 60, PASS_TOTAL = 45, PASS_SEC = 6, PER_SEC = 10;

/* ---------- Speicher ---------- */
let st = {stats:{}, exams:[], settings:{shuffle:false, theme:'system'}, run:null};
try{ const raw = localStorage.getItem(KEY); if(raw){ const o = JSON.parse(raw); st = Object.assign(st, o); st.settings = Object.assign({shuffle:false,theme:'system'}, o.settings||{}); } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function stat(id){ return st.stats[id] || (st.stats[id]={r:0,w:0,s:0,l:-1}); }
function record(id, ok){ const s=stat(id); if(ok){s.r++; s.s++; s.l=1;} else {s.w++; s.s=0; s.l=0;} }
const learned = id => (st.stats[id]?.s||0) >= 2;
const isWrong = id => st.stats[id] && st.stats[id].l===0;

/* ---------- Theme ---------- */
let andDark=null; try{ if(window.Android && Android.isDark) andDark = !!Android.isDark(); }catch(e){}
const sysDark = andDark!==null ? andDark : /[?&]dark=1/.test(location.search) || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches && !/[?&]dark=0/.test(location.search));
function applyTheme(){ const t = st.settings.theme; const dark = t==='dark' || (t==='system' && sysDark); document.documentElement.dataset.theme = dark?'dark':'light'; try{ window.Android && Android.setDark && Android.setDark(dark); }catch(e){} }
applyTheme();

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const L = ['a','b','c'];
const ICON = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',

  flagf:'<svg viewBox="0 0 24 24" fill="#e2a400" stroke="#e2a400" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg>',

};

/* ---------- Navigation ---------- */
let stack = [];
function go(view, params, replace){ if(replace) stack.pop(); stack.push({view, params:params||{}}); render(); window.scrollTo(0,0); }
function back(){
  const cur = stack[stack.length-1];
  if(cur && cur.view==='exam'){ confirmBox('Prüfung abbrechen?','Dein Fortschritt in dieser Simulation geht verloren.','Abbrechen','Weiter prüfen', ()=>{ stopTimer(); st.run=null; save(); stack.pop(); render(); }); return true; }
  if(cur && cur.view==='ptable' && st.prun && st.prun.mode==='pruefung'){ confirmBox('Gerätezusammenstellung abbrechen?','Die laufende Aufgabe wird verworfen.','Abbrechen','Weiter bauen', ()=>{ clearInterval(ptimerH); st.prun=null; save(); stack.pop(); render(); }); return true; }
  if(document.querySelector('.modal-bg')){ document.querySelector('.modal-bg').remove(); return true; }
  if(stack.length>1){ stack.pop(); render(); window.scrollTo(0,0); return true; }
  return false;
}
window.appBack = back;
function header(title, opts){ opts=opts||{};
  return `<header class="top">${stack.length>1?`<button class="iconbtn" onclick="back()" aria-label="Zurück">${ICON.back}</button>`:''}<h1>${esc(title)}</h1>${opts.right||''}</header>${opts.prog!=null?`<div class="progtop" style="background:var(--brand)"><i style="width:${opts.prog}%"></i></div>`:''}`;
}
function confirmBox(title, text, okLabel, cancelLabel, onOk){
  const d=document.createElement('div'); d.className='modal-bg';
  d.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row"><button class="btn ghost" data-x="c">${esc(cancelLabel)}</button><button class="btn" data-x="o">${esc(okLabel)}</button></div></div>`;
  d.addEventListener('click',e=>{ const x=e.target.dataset.x; if(e.target===d||x==='c') d.remove(); if(x==='o'){ d.remove(); onOk(); } });
  document.body.appendChild(d);
}

function render(){
  const cur = stack[stack.length-1];
  const fn = VIEWS[cur.view]; $('#app').innerHTML = fn(cur.params); if(fn.after) fn.after(cur.params);
}

/* ---------- Startseite ---------- */
function ring(p){ const r=36, c=2*Math.PI*r; return `<svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--brand-2)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 42 42)"/><text x="42" y="48" text-anchor="middle" font-size="18" font-weight="750" fill="currentColor">${Math.round(p*100)}%</text></svg>`; }
const VIEWS = {};
VIEWS.home = () => {
  const total = Q.length, nl = Q.filter(q=>learned(q.id)).length, nw = Q.filter(q=>isWrong(q.id)).length;
  const lastExam = st.exams[st.exams.length-1];
  const nsafe = TASKS.filter(t=>praxSafe(t.id)).length;
  const resume = (st.run ? `<button class="btn mt" onclick="resumeExam()">Laufende Theorieprüfung fortsetzen</button>` : '') + (st.prun ? `<button class="btn mt" onclick="go('ptable')">Gerätezusammenstellung ${esc(st.prun.task)} fortsetzen</button>` : '');
  const tile = (onclick, color, icon, title, sub) => `<button class="tile" onclick="${onclick}"><span class="badge" style="background:${color}">${icon}</span><span class="tt"><b>${title}</b><small>${sub}</small></span><span class="chev">${ICON.chev}</span></button>`;
  const ic = d => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  return header('Fischerprüfung NRW',{right:`<button class="iconbtn" onclick="go('info')" aria-label="Info">${ICON.info}</button><button class="iconbtn" onclick="go('settings')" aria-label="Einstellungen">${ICON.gear}</button>`}) + `<div class="wrap">
  <div class="minis">
    <div class="card mini"><div class="lbl">Theorie</div><div class="v">${nl} / ${total}</div><div class="small muted">Fragen gelernt</div><div class="bar"><i style="width:${nl/total*100}%"></i></div></div>
    <div class="card mini"><div class="lbl">Praxis</div><div class="v">${nsafe} / 10</div><div class="small muted">Aufgaben sicher</div><div class="bar"><i style="width:${nsafe*10}%;background:#b06a1f"></i></div></div>
  </div>
  ${resume}
  <button class="btn mt" onclick="startFull()">Komplette Prüfung (Theorie + Gerät)</button>
  <div class="row mt"><button class="btn sec" onclick="startExam()">Nur Theorie</button><button class="btn sec" onclick="startPrax(null,'pruefung')">Nur Gerät</button></div>
  <p class="small muted" style="margin:8px 4px 0">Theorie: 60 Fragen in 60 Minuten · Gerät: zufällige Aufgabe A1–A10 in 15 Minuten${lastExam?` · zuletzt Theorie ${lastExam.score}/60`:''}</p>
  <h2>Praktischer Teil</h2>
  <div class="card">
    ${tile("startPrax(null,'pruefung')",'#b06a1f',ic('<path d="M3 21L17 7"/><path d="M17 7l3-3"/><circle cx="9" cy="15" r="2.5"/><path d="M17 7v6"/>'),'Gerät zusammenstellen','Zufällige Aufgabe am Gerätetisch, Bewertung nach Anlage 2')}
    ${tile("go('ptasks')",'#2f7fb8',ic('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>'),'Aufgaben &amp; Steckbriefe A1–A10',`${nsafe} von 10 sicher · Lösung je Rute`)}
    ${tile("startPQuiz()",'#7b5aa6',ic('<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01"/>'),'Teile-Quiz','Teile erkennen und den Aufgaben zuordnen')}
    ${tile("go('pknots')",'#0f8b8d',ic('<path d="M4 12h5"/><circle cx="12" cy="12" r="3"/><path d="M15 12h5"/><path d="M12 9V4M12 20v-5"/>'),'Knoten','Öhr, Plättchenhaken, Blutknoten, Schlaufe')}
    ${tile("go('phooks')",'#5d6b63',ic('<path d="M12 3v11a4 4 0 1 1-8 0"/><path d="M4 14l2-2"/><circle cx="12" cy="3" r="1"/>'),'Haken','Sorten, Formen, Größen und Training')}
  </div>
  <h2>Theoretischer Teil</h2>
  <div class="row"><button class="btn sec" onclick="startLearn('wrong')" ${nw?'':'disabled'}>Fehler üben (${nw})</button><button class="btn sec" onclick="startLearn('all','random')">Alle gemischt</button></div>
  <div class="card mt">${S.map(s=>{ const qs=Q.filter(q=>q.s===s), l=qs.filter(q=>learned(q.id)).length;
    return `<button class="tile" onclick="go('section',{s:'${s}'})"><span class="badge" style="background:${COL[s]}">${s}</span><span class="tt"><b>${esc(T[s])}</b><small>${l} / ${qs.length} gelernt</small><div class="bar"><i style="width:${l/qs.length*100}%"></i></div></span><span class="chev">${ICON.chev}</span></button>`; }).join('')}</div>
  <h2>Mehr</h2>
  <div class="card">
    <button class="tile" onclick="go('catalog')"><span class="tt"><b>Fragenkatalog durchsuchen</b><small>Alle ${total} amtlichen Fragen mit Lösung</small></span><span class="chev">${ICON.chev}</span></button>
    <button class="tile" onclick="go('history')"><span class="tt"><b>Prüfungsverlauf</b><small>${st.exams.length} Theorie · ${st.prax.res.length} Gerät</small></span><span class="chev">${ICON.chev}</span></button>
  </div></div>`;
};

/* ---------- Sachgebiet ---------- */
VIEWS.section = ({s}) => {
  const qs=Q.filter(q=>q.s===s), l=qs.filter(q=>learned(q.id)).length, w=qs.filter(q=>isWrong(q.id)).length, open=qs.length-l;
  return header(T[s]) + `<div class="wrap">
  <div class="card hero">${ring(l/qs.length)}<div><p class="t1">${esc(T[s])}</p><p class="t2">${qs.length} Fragen · ${l} gelernt · ${w} zuletzt falsch</p></div></div>
  <button class="btn mt" onclick="startLearn('sec','order','${s}')">Der Reihe nach</button>
  <button class="btn sec mt" onclick="startLearn('sec','random','${s}')">Zufällige Reihenfolge</button>
  <button class="btn sec mt" onclick="startLearn('open','random','${s}')" ${open?'':'disabled'}>Nur noch nicht gelernte (${open})</button>
  <button class="btn sec mt" onclick="startLearn('wrong','random','${s}')" ${w?'':'disabled'}>Nur zuletzt falsche (${w})</button>
  <button class="btn ghost mt" onclick="go('catalog',{s:'${s}'})">Fragen mit Lösungen ansehen</button>
  </div>`;
};

/* ---------- Lernmodus ---------- */
let learn = null;
function makeOrder(q){ return st.settings.shuffle ? shuffle([0,1,2]) : [0,1,2]; }
function startLearn(kind, mode, s){
  let qs = Q.filter(q=> !s || q.s===s);
  if(kind==='wrong') qs = qs.filter(q=>isWrong(q.id));
  if(kind==='open') qs = qs.filter(q=>!learned(q.id));
  if(!qs.length) return;
  if(mode!=='order') qs = shuffle(qs);
  learn = {ids: qs.map(q=>q.id), i:0, ans:null, order:null, right:0, done:0, title: s?T[s]:(kind==='wrong'?'Fehler üben':'Alle Fragen')};
  learn.order = makeOrder();
  go('learn');
}
VIEWS.learn = () => {
  if(!learn) return '';
  if(learn.i >= learn.ids.length){
    return header(learn.title) + `<div class="wrap"><div class="card result mt2"><p class="muted">Runde beendet</p><p class="big">${learn.right} / ${learn.done}</p><p class="muted">richtig beantwortet</p></div>
    <button class="btn mt2" onclick="back()">Fertig</button></div>`;
  }
  const q = byId[learn.ids[learn.i]], a = learn.ans, ord = learn.order;
  const opts = ord.map((oi,pos)=>{ let cls='opt'; if(a!=null){ if(oi===q.c) cls+=' ok'; else if(oi===a) cls+=' bad'; }
    return `<button class="${cls}" ${a!=null?'disabled':''} onclick="answerLearn(${oi})"><span class="k">${L[pos]}</span><span>${esc(q.a[oi])}</span></button>`; }).join('');
  const fb = a==null ? '' : (a===q.c ? `<div class="fb ok">Richtig!</div>` : `<div class="fb bad">Leider falsch – richtig ist ${L[ord.indexOf(q.c)]})</div>`);
  const prog = (learn.i)/learn.ids.length*100;
  return header(learn.title,{prog}) + `<div class="wrap">
  <div class="qmeta"><span class="chip"><span class="dot" style="background:${COL[q.s]}"></span>${q.s} ${q.n}</span><span>${learn.i+1} / ${learn.ids.length}</span></div>
  <div class="card pad"><p class="qtext">${esc(q.q)}</p><div class="opts">${opts}</div>${fb}${a!=null&&q.h?`<div class="note">${esc(q.h)}</div>`:''}</div>
  </div>
  <div class="bottombar"><div class="in"><button class="btn ghost" onclick="skipLearn()">${a==null?'Überspringen':'Beenden'}</button><button class="btn" onclick="nextLearn()" ${a==null?'disabled':''}>Weiter</button></div></div>`;
};
function answerLearn(oi){ if(learn.ans!=null) return; learn.ans=oi; const ok = oi===byId[learn.ids[learn.i]].c; record(learn.ids[learn.i], ok); learn.done++; if(ok) learn.right++; save(); render(); }
function nextLearn(){ learn.i++; learn.ans=null; learn.order=makeOrder(); render(); window.scrollTo(0,0); }
function skipLearn(){ if(learn.ans==null){ nextLearn(); } else { learn.i=learn.ids.length; render(); } }

/* ---------- Prüfung ---------- */
let timerH = null;
function startExam(){
  if(st.run){ confirmBox('Neue Prüfung starten?','Die laufende Simulation wird verworfen.','Neu starten','Abbrechen', reallyStart); return; }
  reallyStart();
}
function reallyStart(){
  const ids=[]; S.forEach(s=>{ shuffle(Q.filter(q=>q.s===s)).slice(0,PER_SEC).forEach(q=>ids.push(q.id)); });
  st.run = {ids, ans:{}, flags:{}, orders:Object.fromEntries(ids.map(id=>[id, makeOrder()])), i:0, start:Date.now(), end:Date.now()+EXAM_MIN*60000};
  save(); go('exam');
}
function resumeExam(){ if(!st.run) return; if(Date.now()>=st.run.end){ submitExam(true); return; } go('exam'); }
function fmt(ms){ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function stopTimer(){ if(timerH){ clearInterval(timerH); timerH=null; } }
function tick(){ const el=$('#timer'); if(!st.run){ stopTimer(); return; } const left=st.run.end-Date.now(); if(el){ el.textContent=fmt(left); el.classList.toggle('low', left<5*60000); } if(left<=0){ stopTimer(); submitExam(true); } }
VIEWS.exam = () => {
  const r = st.run; if(!r) return '';
  const id = r.ids[r.i], q = byId[id], a = r.ans[id], ord = r.orders[id];
  const answered = Object.keys(r.ans).length;
  const opts = ord.map((oi,pos)=>`<button class="opt ${a===oi?'sel':''}" onclick="answerExam(${oi})"><span class="k">${L[pos]}</span><span>${esc(q.a[oi])}</span></button>`).join('');
  return header('Prüfung',{right:`<span class="timer" id="timer">${fmt(r.end-Date.now())}</span><button class="iconbtn" onclick="go('overview')" aria-label="Übersicht">${ICON.grid}</button>`, prog: answered/r.ids.length*100}) + `<div class="wrap">
  <div class="qmeta"><span class="chip"><span class="dot" style="background:${COL[q.s]}"></span>${esc(T[q.s])}</span><span>Frage ${r.i+1} / ${r.ids.length}</span></div>
  <div class="card pad"><p class="qtext">${esc(q.q)}</p><div class="opts">${opts}</div>
  <div class="row mt" style="justify-content:flex-end"><button class="btn ghost" style="flex:none;width:auto;padding:10px 14px" onclick="toggleFlag()">${r.flags[id]?ICON.flagf:ICON.flag}<span>${r.flags[id]?'Markiert':'Markieren'}</span></button></div></div>
  <p class="small muted" style="margin:12px 4px">${answered} von ${r.ids.length} beantwortet</p>
  </div>
  <div class="bottombar"><div class="in"><button class="btn ghost" onclick="moveExam(-1)" ${r.i===0?'disabled':''}>Zurück</button>${r.i<r.ids.length-1?`<button class="btn" onclick="moveExam(1)">Weiter</button>`:`<button class="btn" onclick="askSubmit()">Abgeben</button>`}</div></div>`;
};
VIEWS.exam.after = () => { stopTimer(); timerH=setInterval(tick, 1000); };
function answerExam(oi){ const r=st.run, id=r.ids[r.i]; r.ans[id]=oi; save(); render(); }
function toggleFlag(){ const r=st.run, id=r.ids[r.i]; if(r.flags[id]) delete r.flags[id]; else r.flags[id]=1; save(); render(); }
function moveExam(d){ const r=st.run; r.i=Math.min(r.ids.length-1, Math.max(0, r.i+d)); save(); render(); window.scrollTo(0,0); }
VIEWS.overview = () => {
  const r=st.run; if(!r) return '';
  const answered = Object.keys(r.ans).length;
  return header('Übersicht',{right:`<span class="timer" id="timer">${fmt(r.end-Date.now())}</span>`}) + `<div class="wrap secgrid">
  <p class="small muted mt">${answered} von ${r.ids.length} beantwortet · ${Object.keys(r.flags).length} markiert</p>
  ${S.map(s=>`<h3>${esc(T[s])}</h3><div class="grid">${r.ids.map((id,i)=>[id,i]).filter(([id])=>byId[id].s===s).map(([id,i])=>`<button class="cell ${r.ans[id]!=null?'ans':''} ${r.flags[id]?'flag':''} ${i===r.i?'cur':''}" onclick="jumpExam(${i})">${i+1}</button>`).join('')}</div>`).join('')}
  </div>
  <div class="bottombar"><div class="in"><button class="btn ghost" onclick="back()">Zur Frage</button><button class="btn" onclick="askSubmit()">Abgeben</button></div></div>`;
};
VIEWS.overview.after = VIEWS.exam.after;
function jumpExam(i){ st.run.i=i; save(); stack.pop(); render(); window.scrollTo(0,0); }
function askSubmit(){ const r=st.run, open=r.ids.length-Object.keys(r.ans).length;
  confirmBox('Prüfung abgeben?', open?`Du hast noch ${open} Frage${open===1?'':'n'} unbeantwortet. Unbeantwortete Fragen zählen als falsch.`:'Alle Fragen sind beantwortet.','Abgeben','Weiter prüfen', ()=>submitExam(false)); }
function submitExam(timeout){
  stopTimer(); const r=st.run; if(!r) return;
  const per={}; S.forEach(s=>per[s]=0); let score=0;
  r.ids.forEach(id=>{ const q=byId[id], a=r.ans[id], ok=a===q.c; if(ok){score++; per[q.s]++;} if(a!=null) record(id, ok); });
  const passed = score>=PASS_TOTAL && S.every(s=>per[s]>=PASS_SEC);
  const res = {full:!!r.full, date:Date.now(), score, per, passed, timeout, dur:Math.min(Date.now(), r.end)-r.start, ids:r.ids, ans:r.ans, orders:r.orders};
  st.exams.push(res); if(st.exams.length>30){ st.exams.splice(0, st.exams.length-30); st.exams.forEach(e=>{}); }
  st.run=null; save();
  stack = stack.filter(x=>x.view!=='exam' && x.view!=='overview');
  go('result',{idx: st.exams.length-1});
}
VIEWS.result = ({idx}) => {
  const e=st.exams[idx]; if(!e) return header('Ergebnis')+'<div class="wrap"><p class="empty">Nicht gefunden.</p></div>';
  const failSec = S.filter(s=>e.per[s]<PASS_SEC);
  let why = '';
  if(!e.passed){ const parts=[]; if(e.score<PASS_TOTAL) parts.push(`mindestens ${PASS_TOTAL} richtige Antworten nötig`); if(failSec.length) parts.push(`in ${failSec.map(s=>T[s]).join(', ')} weniger als ${PASS_SEC} richtig`); why=`<p class="small muted mt">${esc(parts.join('; '))}.</p>`; }
  return header('Ergebnis') + `<div class="wrap">
  <div class="card result mt2"><p class="muted">${e.timeout?'Zeit abgelaufen · ':''}${new Date(e.date).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'})}</p>
  <p class="big">${e.score} / 60</p><span class="verdict ${e.passed?'ok':'bad'}">${e.passed?'Bestanden':'Nicht bestanden'}</span>${why}

  <h2>Je Sachgebiet</h2>
  <div class="card pad"><table class="sec">${S.map(s=>`<tr><td><span class="chip"><span class="dot" style="background:${COL[s]}"></span>${s}</span> ${esc(T[s])}</td><td class="n ${e.per[s]>=PASS_SEC?'okc':'badc'}">${e.per[s]} / 10</td></tr>`).join('')}</table>
  <p class="small muted" style="margin:10px 0 0">Bestanden mit mindestens ${PASS_TOTAL} von 60 richtigen Antworten und mindestens ${PASS_SEC} je Sachgebiet.</p></div>
  ${e.full && !st.prax.res.some(x=>x.full && x.theory===idx) ? `<button class="btn mt2" onclick="startPrax(null,'pruefung',${idx})">Weiter zum praktischen Teil</button>` : ''}

  <button class="btn sec mt" onclick="go('review',{idx:${idx},only:false})">Alle Antworten ansehen</button>
  <button class="btn ghost mt" onclick="stack=[stack[0]];render()">Zur Startseite</button>
  </div>`;
};
VIEWS.review = ({idx, only}) => {
  const e=st.exams[idx]; const ids = e.ids.filter(id=>!only || e.ans[id]!==byId[id].c);
  return header(only?'Falsche Antworten':'Alle Antworten') + `<div class="wrap">${ids.length?`<div class="card mt2">${ids.map(id=>qItem(byId[id], e.ans[id]===undefined?-1:e.ans[id], e.orders?e.orders[id]:null, e.ids.indexOf(id)+1)).join('')}</div>`:`<p class="empty">Keine falschen Antworten – stark!</p>`}</div>`;
};
function qItem(q, given, ord, num){
  ord = ord || [0,1,2];
  const lis = ord.map((oi,pos)=>{ let c=''; if(oi===q.c) c='c'; else if(oi===given) c='w'; return `<li class="${c}">${L[pos]}) ${esc(q.a[oi])}</li>`; }).join('');
  const tag = given===undefined ? '' : (given===-1?' · <span class="badc">nicht beantwortet</span>': (given===q.c?' · <span class="okc">richtig</span>':' · <span class="badc">falsch</span>'));
  return `<div class="qitem"><div class="id">${num?`FRAGE ${num} · `:''}${q.s} ${q.n}${tag}</div><div class="q">${esc(q.q)}</div><ol>${lis}</ol>${q.h?`<div class="note">${esc(q.h)}</div>`:''}</div>`;
}

};

let cat = {s:null, term:''};
VIEWS.catalog = (p) => {

  <div class="filters"><button class="fbtn ${!cat.s?'on':''}" onclick="cat.s=null;render()">Alle</button>${S.map(s=>`<button class="fbtn ${cat.s===s?'on':''}" onclick="cat.s='${s}';render()">${s} · ${esc(T[s])}</button>`).join('')}</div></div>
  <p class="small muted" id="cnt" style="margin:10px 4px"></p><div class="card" id="list"></div></div>`;

function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss'); }
function drawCat(){
  const t = norm(cat.term.trim());
  const qs = Q.filter(q=>(!cat.s||q.s===cat.s) && (!t || norm(q.q+' '+q.a.join(' ')+' '+q.s+q.n).includes(t)));

  $('#cnt').textContent = `${qs.length} Frage${qs.length===1?'':'n'}`;
  $('#list').innerHTML = shown.length ? shown.map(q=>qItem(q)).join('') : `<p class="empty">Keine Treffer.</p>`;
}

/* ---------- Grafiken (eigene, schematische SVG) ---------- */
const GX = (function(){
const INK='#17231d', DARK='#2b3a33', DARK2='#3a4a42', CORK='#c9a46a', METAL='#8a959a', MET2='#c4ccd0', LEAD='#6b7378',
      LINE='#1f6b4f', TAG='#b06a1f', GREEN='#2f8a66', ORANGE='#e9a25a', RED='#d64545', YEL='#f2c14e', GOLD='#c9a227', BLUE='#2f7fb8';
const svg=(vb,b)=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${b}</svg>`;

/* --- Ruten --- */
function rod(o){
  const x0=10, L=Math.round(30+o.len*56), x1=x0+L, y=32, th0=o.th||3.5;
  let h=`<rect x="${x0-5}" y="${y-5}" width="6" height="10" rx="2" fill="${DARK}"/>`, hx;
  const grip=o.eva?DARK2:CORK;
  if(o.kind==='fliege'){ h+=`<rect x="${x0}" y="${y-5}" width="14" height="10" rx="2" fill="${METAL}"/><rect x="${x0+14}" y="${y-6}" width="38" height="12" rx="5" fill="${CORK}"/>`; hx=x0+52; }
  else if(o.kind==='spinn'){ h+=`<rect x="${x0}" y="${y-5.5}" width="26" height="11" rx="5" fill="${grip}"/><rect x="${x0+26}" y="${y-5}" width="16" height="10" rx="2" fill="${METAL}"/><rect x="${x0+42}" y="${y-5.5}" width="14" height="11" rx="5" fill="${grip}"/>`; hx=x0+56; }
  else { h+=`<rect x="${x0}" y="${y-6}" width="40" height="12" rx="5" fill="${grip}"/><rect x="${x0+40}" y="${y-5}" width="16" height="10" rx="2" fill="${METAL}"/><rect x="${x0+56}" y="${y-6}" width="16" height="12" rx="5" fill="${grip}"/>`; hx=x0+72; }
  h+=`<polygon points="${hx},${y-th0/2} ${x1},${y-0.6} ${x1},${y+0.6} ${hx},${y+th0/2}" fill="${o.blank||DARK}"/>`;
  const tw=x=>th0-(th0-1.2)*(x-hx)/(x1-hx);
  (o.joints||[]).forEach(f=>{ const x=hx+(x1-hx)*f, t=tw(x)+1.8; h+=`<rect x="${(x-3).toFixed(1)}" y="${(y-t/2).toFixed(1)}" width="6" height="${t.toFixed(1)}" rx="1" fill="${INK}"/>`; });
  (o.rings||[]).forEach(([f,r])=>{ const x=hx+(x1-hx)*f, t=tw(x), cy=y+t/2+3+r; h+=`<line x1="${x.toFixed(1)}" y1="${(y+t/2).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(cy-r).toFixed(1)}" stroke="${METAL}" stroke-width="1.5"/><circle cx="${x.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" fill="none" stroke="${METAL}" stroke-width="1.6"/>`; });
  h+=`<circle cx="${x1}" cy="${y}" r="2" fill="none" stroke="${METAL}" stroke-width="1.4"/>`;
  if(o.tips){

    h+=`<line x1="${x1-26}" y1="${y}" x2="${x1}" y2="${y}" stroke="#57be92" stroke-width="2"/>`;
  }
  return svg('0 0 330 64',h);
}

/* ---------- Bewertung nach Anlage 2 ---------- */
function praxScore(task, picks, zub){
  const t = TBY[task], rows=[]; let gear=0, acc=0;
  POS.forEach(p=>{
    const exp=t.sol[p.k], pick=picks[p.k];
    const ok = exp.length===0 ? pick==='none' : exp.includes(pick);
    let pts = ok ? p.max : 0;
    if(!ok && p.part && pick && pick!=='none' && exp.length && IT[pick].g && exp.some(e=>IT[e].g===IT[pick].g)) pts = 1;
    gear+=pts; rows.push({n:p.n, name:p.name, pick, pts, max:p.max, sol:t.txt[p.k]});
  });
  ZPOS.forEach(p=>{
    const exp=t.sol[p.k], got=zub.filter(id=>IT[id].c===p.k);
    const ok = got.length===exp.length && got.every(id=>exp.includes(id));
    const pts = ok ? p.max : 0; acc+=pts;
    rows.push({n:p.n, name:p.name, pick: got.length?got.map(id=>IT[id].name).join(', '):'–', pts, max:p.max, zub:true,
      sol: exp.length ? exp.map(id=>IT[id].name).join(', ') : 'entfällt'});
  });
  const cats = zub.map(id=>ZORD[IT[id].c]);
  const orderOk = zub.length>=3 && cats.every((c,i)=>i===0||c>=cats[i-1]);
  const ro = orderOk?2:0; acc+=ro;
  rows.push({n:16, name:'Reihenfolge', pick: orderOk?'eingehalten':'nicht eingehalten', pts:ro, max:2, zub:true, sol:'Landehilfe → Messen → Betäuben → Töten → Rachensperre → Haken entfernen'});
  return {rows, gear, acc, total:gear+acc, passed:gear+acc>=PRAX_PASS};
}

/* ---------- Gerätetisch ---------- */
let ptimerH=null;
function startPrax(id, mode, theoryIdx){
  const task = id || TASKS[Math.floor(Math.random()*TASKS.length)].id;
  const full = typeof theoryIdx==='number';
  st.prun = {task, mode, full, theory: full?theoryIdx:null, step:0, picks:{}, zub:[], start:Date.now(), end: mode==='pruefung' ? Date.now()+PRAX_MIN*60000 : null};
  save(); stack = stack.filter(x=>x.view!=='ptable'); go('ptable');
}
function praxTick(){ const r=st.prun, el=$('#ptimer'); if(!r||!r.end){ clearInterval(ptimerH); ptimerH=null; return; } const left=r.end-Date.now(); if(el){ el.textContent=fmt(left); el.classList.toggle('low', left<3*60000);} if(left<=0){ clearInterval(ptimerH); ptimerH=null; submitPrax(true); } }
VIEWS.ptable = () => {
  const r=st.prun; if(!r) return header('Gerätetisch')+'<div class="wrap"><p class="empty">Keine Aufgabe aktiv.</p></div>';
  const t=TBY[r.task];
  const chips = POS.map((p,i)=>`<button class="pchip ${i===r.step?'cur':(r.picks[p.k]?'done':'')}" onclick="praxStep(${i})">${p.n} ${p.name}</button>`).join('') + `<button class="pchip ${r.step===9?'cur':(r.zub.length?'done':'')}" onclick="praxStep(9)">Zubehör</button>`;
  const right = r.end ? `<span class="timer" id="ptimer">${fmt(r.end-Date.now())}</span>` : '';
  const task = `<div class="card pad mt2" style="display:flex;gap:12px;align-items:flex-start"><span class="badge" style="background:${GRP_COL[t.grp]}">${t.id}</span><p style="margin:0;font-size:15px">${esc(t.text)}</p></div>`;
  if(r.step<9){
    const p=POS[r.step], cur=r.picks[p.k];
    const items = Object.keys(IT).filter(id=>IT[id].c===p.k);
    return header(r.mode==='pruefung'?'Prüfung · Gerät':'Gerätetisch',{right, prog:r.step/10*100}) + `<div class="wrap">${task}
    <div class="pchips">${chips}</div>
    <div class="lbl" style="margin:14px 4px 0">Position ${p.n} von 9</div><h3 class="ph">${p.q}</h3>
    <div class="ptiles ${p.k==='rute'?'one':''}">${items.map(id=>`<button class="ptile ${cur===id?'sel':''}" onclick="praxPick('${id}')">${plate(id)}<span class="pn">${esc(IT[id].name)}</span><span class="pc">${esc(IT[id].card||'')}</span></button>`).join('')}</div>
    </div>
    <div class="bottombar"><div class="in"><button class="btn ghost ${cur==='none'?'selb':''}" onclick="praxPick('none')">${cur==='none'?'✓ ':''}Entfällt</button><button class="btn" onclick="praxStep(${r.step+1})" ${cur?'':'disabled'}>Weiter</button></div></div>`;
  }
  const order = r.zub;
  return header(r.mode==='pruefung'?'Prüfung · Zubehör':'Zubehör',{right, prog:90}) + `<div class="wrap">${task}
    <div class="pchips">${chips}</div>
    <div class="lbl" style="margin:14px 4px 0">Position 10–16</div><h3 class="ph">Was brauchst du nach dem Biss?</h3>
    <p class="small muted" style="margin:0 4px 10px">Tippe das Zubehör in der Reihenfolge an, in der du es verwendest. Nicht benötigte Teile lässt du liegen. Erneut tippen entfernt ein Teil.</p>
    <div class="card pad" style="padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px"><span class="small muted">Reihenfolge:</span>${order.length?order.map((id,k)=>`<span class="chip on">${k+1}. ${esc(IT[id].name)}</span>`).join(''):'<span class="small muted">noch nichts gewählt</span>'}</div>
    <div class="ptiles z mt">${ZTISCH.map(id=>{ const k=order.indexOf(id); return `<button class="ptile ${k>=0?'sel':''}" onclick="praxZub('${id}')">${k>=0?`<span class="ordn">${k+1}</span>`:''}${plate(id)}<span class="pn">${esc(IT[id].name)}</span></button>`; }).join('')}</div>
    </div>
    <div class="bottombar"><div class="in"><button class="btn ghost" onclick="st.prun.zub=[];save();render()">Zurücksetzen</button><button class="btn" onclick="askPrax()">Abgeben</button></div></div>`;
};
VIEWS.ptable.after = () => { clearInterval(ptimerH); ptimerH=null; if(st.prun && st.prun.end) ptimerH=setInterval(praxTick,1000); const c=document.querySelector('.pchip.cur'); if(c) c.parentNode.scrollLeft = c.offsetLeft - 16; };
function praxPick(id){ const r=st.prun, k=POS[r.step].k; r.picks[k]=id; save(); render(); }
function praxStep(i){ st.prun.step=Math.max(0,Math.min(9,i)); save(); render(); window.scrollTo(0,0); }
function praxZub(id){ const z=st.prun.zub, k=z.indexOf(id); if(k>=0) z.splice(k,1); else z.push(id); save(); render(); }
function askPrax(){ const r=st.prun, open=POS.filter(p=>!r.picks[p.k]).length;
  confirmBox('Zusammenstellung abgeben?', open?`Bei ${open} Position${open===1?'':'en'} hast du noch nichts gewählt. Sie zählen mit 0 Punkten.`:'Alle Positionen sind ausgefüllt.','Abgeben','Weiter bauen',()=>submitPrax(false)); }
function submitPrax(timeout){
  clearInterval(ptimerH); ptimerH=null; const r=st.prun; if(!r) return;
  const sc = praxScore(r.task, r.picks, r.zub);
  const res = {date:Date.now(), task:r.task, mode:r.mode, full:r.full, picks:r.picks, zub:r.zub, total:sc.total, gear:sc.gear, acc:sc.acc, passed:sc.passed, timeout, dur:Math.min(Date.now(), r.end||Date.now())-r.start, theory: r.full ? r.theory : null};
  st.prax.res.push(res); if(st.prax.res.length>50) st.prax.res.splice(0, st.prax.res.length-50);
  const tk = st.prax.tasks[r.task] || {n:0,best:0}; tk.n++; tk.last=sc.total; tk.best=Math.max(tk.best,sc.total); st.prax.tasks[r.task]=tk;
  st.prun=null; save();
  stack = stack.filter(x=>x.view!=='ptable');
  go('pres',{idx: st.prax.res.length-1});
}

/* ---------- Bewertung ---------- */
VIEWS.pres = ({idx}) => {
  const e=st.prax.res[idx]; if(!e) return header('Bewertung')+'<div class="wrap"><p class="empty">Nicht gefunden.</p></div>';
  const t=TBY[e.task], sc=praxScore(e.task, e.picks, e.zub);
  const nm = id => !id ? 'nichts gewählt' : (id==='none' ? 'entfällt' : IT[id].name + (IT[id].card?` (${IT[id].card})`:''));
  const row = rw => { const full=rw.pts===rw.max, cls = full?'okc':(rw.pts>0?'warnc':'badc');
    return `<div class="brow"><span class="bn">${rw.n}</span><div class="tt"><b>${rw.name}</b><span class="muted"> · ${esc(rw.zub?rw.pick:nm(rw.pick))}</span>${full?'':`<div class="fix">Richtig: ${esc(rw.sol)}</div>`}</div><b class="${cls}">${rw.pts}/${rw.max}</b></div>`; };
  let combo='';
  if(e.full && e.theory!=null && st.exams[e.theory]){ const th=st.exams[e.theory], all=th.passed&&e.passed;
    combo = `<div class="card pad mt2"><div class="lbl">Komplette Prüfung</div>
      <div class="brow"><div class="tt"><b>Theorie</b></div><b class="${th.passed?'okc':'badc'}">${th.score}/60 · ${th.passed?'bestanden':'nicht bestanden'}</b></div>
      <div class="brow"><div class="tt"><b>Gerät</b></div><b class="${e.passed?'okc':'badc'}">${e.total}/28 · ${e.passed?'bestanden':'nicht bestanden'}</b></div>
      <div style="text-align:center;margin-top:10px"><span class="verdict ${all?'ok':'bad'}">${all?'Gesamt bestanden':'Gesamt nicht bestanden'}</span></div>
      <p class="small muted" style="margin:10px 0 0">Die Artenkenntnis (4 von 6 Bildtafeln) ist in der App nicht enthalten.${!th.passed?' In der echten Prüfung scheidet aus, wer den theoretischen Teil nicht besteht.':''}</p></div>`; }
  return header(`Bewertung · ${t.id}`) + `<div class="wrap">${combo}
  <div class="card result mt2"><p class="muted">${esc(t.rod)} · ${esc(t.fish)}${e.timeout?' · Zeit abgelaufen':''}</p>
  <p class="big">${e.total} / 28</p><span class="verdict ${e.passed?'ok':'bad'}">${e.passed?'Bestanden':'Nicht bestanden'}</span>
  <p class="small muted mt">Bestanden ab 25 Punkten · Zeit ${fmt(e.dur)} min</p></div>
  <h2>Bewertungsbogen · Gerät</h2><div class="card">${sc.rows.filter(x=>!x.zub).map(row).join('')}<div class="brow sum"><b>Punktezahl Geräte (1–9)</b><b>${sc.gear} / 17</b></div></div>
  <h2>Bewertungsbogen · Zubehör</h2><div class="card">${sc.rows.filter(x=>x.zub).map(row).join('')}<div class="brow sum"><b>Punktezahl Zubehör (10–16)</b><b>${sc.acc} / 11</b></div></div>
  <p class="small muted" style="margin:10px 4px">Rute, Rolle und Schnur: 1 Punkt, wenn die Art stimmt, aber die Größe oder Tragkraft nicht.</p>
  <div class="row mt"><button class="btn sec" onclick="go('pcard',{t:'${t.id}'})">Steckbrief ${t.id}</button><button class="btn sec" onclick="startPrax('${t.id}','uebung')">Nochmal ${t.id}</button></div>
  <button class="btn mt" onclick="startPrax(null,'pruefung')">Neue zufällige Aufgabe</button>
  <button class="btn ghost mt" onclick="stack=[stack[0]];render()">Zur Startseite</button>
  </div>`;
};

/* ---------- Komplette Prüfung ---------- */
function startFull(){ const go2=()=>{ reallyStart(); st.run.full=true; save(); }; if(st.run){ confirmBox('Neue Prüfung starten?','Die laufende Simulation wird verworfen.','Neu starten','Abbrechen', go2); return; } go2(); }

/* ---------- Teile-Quiz ---------- */
let pq=null;
function startPQuiz(){
  const qs=[]; const ids=Object.keys(IT);
  const ident = ids.filter(id=>!['rute','schnur','wirbel','haken'].includes(IT[id].c) && !['stat_klein','stat_mittel','stat_gross','stat_schwer','stahl_barsch','stahl_hecht','stahl_kurz','vf_fein','vf_stark'].includes(id));
  for(let i=0;i<10;i++){
    if(i%2===0){ // Was ist das?
      const id=ident[Math.floor(Math.random()*ident.length)];
      const pool=shuffle(ident.filter(x=>x!==id && IT[x].name!==IT[id].name && (IT[x].c===IT[id].c || ZPOS.some(p=>p.k===IT[x].c)===ZPOS.some(p=>p.k===IT[id].c)))).slice(0,2);
      while(pool.length<2){ const x=ident[Math.floor(Math.random()*ident.length)]; if(x!==id && !pool.includes(x) && IT[x].name!==IT[id].name) pool.push(x); }
      qs.push({kind:'ident', img:id, opts:shuffle([id,...pool]), ok:[id], q:'Welches Teil ist das?'});
    } else { // Zuordnung
      const t=TASKS[Math.floor(Math.random()*TASKS.length)];
      const ks=POS.filter(p=>t.sol[p.k].length).map(p=>p.k).concat(['lande','hakenentf'].filter(k=>t.sol[k].length));
      const k=ks[Math.floor(Math.random()*ks.length)], ok=t.sol[k];
      const wrong=shuffle(ids.filter(x=>IT[x].c===k && !ok.includes(x))).slice(0,2);
      const pos=POS.find(p=>p.k===k)||ZPOS.find(p=>p.k===k);
      qs.push({kind:'assign', task:t.id, opts:shuffle([ok[0],...wrong]), ok, q:`${t.id} ${t.rod} (${t.fish}): Welche${pos.k==='lande'?' Landehilfe':pos.k==='hakenentf'?'s Werkzeug zum Haken entfernen':'s Teil für „'+pos.name+'“'}?`});
    }
  }
  pq={qs,i:0,ans:null,right:0}; go('pquiz');
}
VIEWS.pquiz = () => {
  if(!pq) return '';
  if(pq.i>=pq.qs.length) return header('Teile-Quiz') + `<div class="wrap"><div class="card result mt2"><p class="muted">Runde beendet</p><p class="big">${pq.right} / ${pq.qs.length}</p><p class="muted">richtig</p></div><button class="btn mt2" onclick="startPQuiz()">Neue Runde</button><button class="btn ghost mt" onclick="back()">Fertig</button></div>`;
  const q=pq.qs[pq.i], a=pq.ans;
  const opt = id => { let cls='ptile'; if(a!=null){ if(q.ok.includes(id)) cls+=' okt'; else if(id===a) cls+=' badt'; } return `<button class="${cls}" ${a!=null?'disabled':''} onclick="answerPQ('${id}')">${q.kind==='assign'?plate(id):''}<span class="pn">${esc(IT[id].name)}</span>${q.kind==='assign'&&IT[id].card?`<span class="pc">${esc(IT[id].card)}</span>`:''}</button>`; };
  return header('Teile-Quiz',{prog:pq.i/pq.qs.length*100}) + `<div class="wrap">
  <div class="qmeta"><span class="chip">${q.kind==='ident'?'Erkennen':'Zuordnen'}</span><span>${pq.i+1} / ${pq.qs.length}</span></div>
  <div class="card pad"><p class="qtext">${esc(q.q)}</p>${q.kind==='ident'?`<div class="mt">${plate(q.img,'lg')}</div>`:''}
  <div class="ptiles ${q.kind==='ident'?'one':''} mt">${q.opts.map(opt).join('')}</div>
  ${a!=null?(q.ok.includes(a)?`<div class="fb ok">Richtig!</div>`:`<div class="fb bad">Leider falsch – richtig: ${esc(q.ok.map(x=>IT[x].name).join(' oder '))}</div>`):''}</div></div>
  <div class="bottombar"><div class="in"><button class="btn" onclick="pq.i++;pq.ans=null;render();window.scrollTo(0,0)" ${a==null?'disabled':''}>Weiter</button></div></div>`;
};
function answerPQ(id){ if(pq.ans!=null) return; pq.ans=id; if(pq.qs[pq.i].ok.includes(id)) pq.right++; render(); }

/* ---------- Knoten ---------- */
const KNOTS = [
  {k:'oehr', name:'Knoten für Öhr (Haken, Wirbel)', use:'Öhrhaken und Wirbel an die Schnur binden (Clinchknoten).', steps:['Schnur durchs Öhr ziehen, ca. 10 cm überstehen lassen.','Freies Ende 5× um die Hauptschnur wickeln.','Ende durch die erste Schlaufe am Öhr stecken.','Anfeuchten, festziehen, überstehendes Ende kürzen.']},
  {k:'plaettchen', name:'Knoten für Plättchenhaken', use:'Haken ohne Öhr, mit flachem Plättchen am Schenkelende.', steps:['Schnur am Hakenschenkel entlang legen und eine Schlaufe bilden.','Freies Ende 6–8× um Schenkel und Schnur wickeln.','Ende durch die Schlaufe führen und an der Hauptschnur ziehen.','Anfeuchten, festziehen, Ende kürzen – die Windungen liegen am Plättchen.']},
  {k:'blut', name:'Blutknoten', use:'Zwei Schnüre verbinden, z. B. Schlagschnur an die Hauptschnur.', steps:['Beide Schnurenden gegenläufig überlappen lassen.','Jedes Ende 5× um die andere Schnur wickeln.','Beide Enden gegenläufig durch die Mitte stecken.','Anfeuchten, gleichmäßig festziehen, Enden kürzen.']},
  {k:'schlaufe', name:'Schlaufenknoten', use:'Feste Schlaufe am Schnurende, z. B. für Schlaufenverbindungen.', steps:['Schnurende doppelt legen.','Mit der doppelten Schnur einen einfachen Knoten legen.','Die Schlaufe ein zweites Mal durch den Knoten führen.','Anfeuchten, festziehen, Ende kürzen.']}
];
VIEWS.pknots = () => header('Knoten') + `<div class="wrap">
  <p class="small muted" style="margin:16px 4px 0">Grün: Hauptschnur · Orange: freies Ende. Laut Ausbildungsrichtlinie werden Knoten in der Prüfung in der Regel nicht abgefragt – für das Angeln am Wasser sind sie aber Pflicht.</p>
  ${KNOTS.map(k=>`<h2>${esc(k.name)}</h2><div class="card pad"><p class="small muted" style="margin:0 0 10px">${esc(k.use)}</p><div class="ksteps">${k.steps.map((s,i)=>`<div class="kstep"><div class="plate">${GX.knots[k.k][i]}</div><div class="kcap"><span class="num">${i+1}</span>${esc(s)}</div></div>`).join('')}</div></div>`).join('')}
  </div>`;

/* ---------- Haken ---------- */
let hq=null;
function newHQ(){ const S=GX.SIZES; let a,b; do{ a=Math.floor(Math.random()*S.length); b=Math.floor(Math.random()*S.length);}while(a===b); hq={a:S[a],b:S[b],ans:null,right:(hq?hq.right:0),n:(hq?hq.n:0)}; }
VIEWS.phooks = () => { if(!hq) newHQ(); const big = GX.SIZES.indexOf(hq.a)>GX.SIZES.indexOf(hq.b)?hq.a:hq.b;
  const hb = s => { let cls='btn ghost'; if(hq.ans!=null){ if(s===big) cls='btn okb'; else if(s===hq.ans) cls='btn badb'; } return `<button class="${cls}" ${hq.ans!=null?'disabled':''} onclick="hq.ans='${s}';hq.n++;if('${s}'==='${big}')hq.right++;render()">Gr. ${s}</button>`; };
  return header('Haken') + `<div class="wrap">
  <h2>Hakensorten</h2><div class="card pad"><div class="plate wide">${GX.sorten()}</div><div class="cap3"><span>Einfachhaken</span><span>Doppelhaken</span><span>Drilling</span></div><p class="small muted" style="margin:8px 0 0">Einfachhaken für Friedfische, Doppel- und Drillingshaken für Raubfische (am Kunstköder).</p></div>
  <h2>Hakenformen</h2><div class="card pad"><div class="plate wide">${GX.formen()}</div><div class="cap4"><span>Öhrhaken</span><span>Plättchen&shy;haken</span><span>Rundbogen&shy;haken</span><span>Wurmhaken</span></div></div>
  <h2>Hakengrößen</h2><div class="card pad"><div class="plate wide">${GX.sizeScale(GX.SIZES.slice(0,7),{'16':'A1, A2','6':'A3, A4'},470)}</div><div class="plate wide mt">${GX.sizeScale(GX.SIZES.slice(7),null,470)}</div><p class="small muted" style="margin:6px 0 0">Oben Gr. 16 bis 4, unten Gr. 2 bis 5/0 (nicht maßstäblich).</p>
    <div class="tipbox mt"><b>Merkregel</b><ul><li>Bei den einfachen Zahlen gilt: je größer die Zahl, desto kleiner der Haken (Gr. 16 ist klein, Gr. 1 groß).</li><li>Ab 1/0 („eins Null“) wird es umgekehrt: 5/0 ist größer als 1/0.</li><li>Prüfung: Gr. 16 bei A1/A2 (Friedfische), Gr. 6 bei A3/A4 (Karpfen, Aal).</li></ul></div></div>
  <h2>Kurzes Training</h2><div class="card pad"><p class="qtext">Welcher Haken ist größer?</p><div class="row mt">${hb(hq.a)}${hb(hq.b)}</div>
    ${hq.ans!=null?`<div class="fb ${hq.ans===big?'ok':'bad'}">${hq.ans===big?'Richtig!':'Leider falsch – Gr. '+big+' ist größer.'}</div><button class="btn mt" onclick="newHQ();render()">Nächstes Paar</button>`:''}
    <p class="small muted" style="margin:10px 0 0">${hq.right} von ${hq.n} richtig</p></div>
  </div>`; };

/* ---------- Start ---------- */
stack=[{view:'home',params:{}}];
render();
if(st.run && Date.now()>=st.run.end){ submitExam(true); }
if(st.prun && st.prun.end && Date.now()>=st.prun.end){ submitPrax(true); }
</script>
<script>
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
</body>
</html>
